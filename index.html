<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Snow Leagues</title>
    <meta
      name="description"
      content="Season standings and a live board of every player's build plot from the Snow Leagues Minecraft server."
    />
    <meta name="theme-color" content="#dcebff" />
    <link rel="canonical" href="https://sl.godden.dev/" />

    <!--
      Link previews. Plot links (/s1?plot=Name) get shared into chat, and a
      scraper reads these rather than the page the router builds, so they are
      static and describe the site rather than whichever plot was linked.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Snow Leagues" />
    <meta property="og:title" content="The Snow Leagues" />
    <meta
      property="og:description"
      content="Season standings and a live board of every player's build plot from the Snow Leagues Minecraft server."
    />
    <meta property="og:url" content="https://sl.godden.dev/" />
    <meta property="og:image" content="https://sl.godden.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Snow Leagues plot board" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Inter, which base.css has asked for since the beginning without anything
      fetching it. Only the weights the site actually uses.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
